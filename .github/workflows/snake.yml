name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: manyapatkar974
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1683FF&color_dots=#07111F,#0B2A4A,#0D4F8B,#1683FF,#5AA9FF
            dist/github-contribution-grid-snake.gif?color_snake=#1683FF&color_dots=#07111F,#0B2A4A,#0D4F8B,#1683FF,#5AA9FF&color_background=#07111F

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
